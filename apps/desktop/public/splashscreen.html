<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YoloWorkBench</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        background: transparent;
      }
      .splash {
        box-sizing: border-box;
        height: 100vh;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 18px;
        padding: 28px;
        text-align: center;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: radial-gradient(120% 120% at 30% 0%, #16243f 0%, #0b1322 60%, #080e1a 100%);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5);
        color: #e8edf6;
        -webkit-user-select: none;
        user-select: none;
      }
      .splash__mark {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(29, 78, 216, 0.32);
        background: linear-gradient(135deg, #1d4ed8, #0f766e);
      }
      .splash__title {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }
      .splash__tagline {
        margin: -6px 0 0;
        font-size: 12.5px;
        color: #9eacc1;
      }
      .splash__bar {
        width: 220px;
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.18);
      }
      .splash__bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #3b82f6, #0f766e);
        animation: slide 1.15s ease-in-out infinite;
      }
      .splash__status {
        margin: 0;
        font-size: 12px;
        color: #c7d2e3;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <img class="splash__mark" src="/assets/app-icon.svg" width="72" height="72" alt="" />
      <h1 class="splash__title">YoloWorkBench</h1>
      <p class="splash__tagline">YOLO 数据集全流程工作台</p>
      <div class="splash__bar" role="progressbar" aria-label="正在启动"></div>
      <p class="splash__status">正在启动…</p>
    </main>
  </body>
</html>
