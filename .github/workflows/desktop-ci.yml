name: Desktop CI

on:
  push:
    branches:
      - feature/direct-video-annotation
      - feature/multimodal-controls
  pull_request:
    paths:
      - "apps/desktop/**"
      - "backend/**"
      - "backend_api/**"
      - "tests/test_multimodal_calibration.py"
      - ".github/workflows/desktop-ci.yml"

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite build
        id: desktop_build
        shell: bash
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          code=$?
          cat build-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Unit tests
        id: desktop_tests
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-diagnostics
          path: |
            apps/desktop/build-output.txt
            apps/desktop/test-output.txt
          if-no-files-found: warn
      - name: Enforce desktop validation
        if: always()
        shell: bash
        run: |
          test "${{ steps.desktop_build.outputs.exit_code }}" = "0"
          test "${{ steps.desktop_tests.outputs.exit_code }}" = "0"

  apriltag-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install calibration dependencies
        run: python -m pip install --disable-pip-version-check numpy Pillow opencv-contrib-python-headless
      - name: Compile multimodal backend modules
        run: python -m py_compile backend/multimodal_calibration.py backend_api/multimodal_main.py
      - name: Test printable sheet and detector round trip
        run: python -m unittest discover -s tests -p "test_multimodal_calibration.py" -v
